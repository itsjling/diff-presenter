name: Fallow audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Audit changed code
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          fail-on-issues: true
